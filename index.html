<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Page Title & Meta Description -->
    <title>ForgeHireloop - Find Tech Jobs &amp; Hire Exceptional Engineers</title>
    <meta name="description" content="Search 1,000+ top engineering, AI, product &amp; leadership roles. Connect directly with hiring teams on ForgeHireloop." />
    <meta name="keywords" content="tech jobs, software engineer jobs, hire developers, remote engineering careers, AI jobs, tech recruitment" />
    <meta name="author" content="ForgeHireloop Technologies Inc." />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://forgehireloop.com/" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#1e293b" />

    <!-- Open Graph / Social Sharing (LinkedIn, Facebook, WhatsApp, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ForgeHireloop" />
    <meta property="og:url" content="https://forgehireloop.com/" />
    <meta property="og:title" content="ForgeHireloop - Find Tech Jobs &amp; Hire Exceptional Engineers" />
    <meta property="og:description" content="Search 1,000+ top engineering, AI, product &amp; leadership roles. Connect directly with hiring teams on ForgeHireloop." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1200&amp;auto=format&amp;fit=crop&amp;q=80" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ForgeHireloop Tech Careers Platform" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@forgehireloop" />
    <meta name="twitter:creator" content="@forgehireloop" />
    <meta name="twitter:title" content="ForgeHireloop - Find Tech Jobs &amp; Hire Exceptional Engineers" />
    <meta name="twitter:description" content="Search 1,000+ top engineering, AI, product &amp; leadership roles. Connect directly with hiring teams on ForgeHireloop." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1200&amp;auto=format&amp;fit=crop&amp;q=80" />

    <!-- Global Schema.org JSON-LD Structured Data for WebSite & Organization -->
    <script type="application/ld+json" id="structured-data-root">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://forgehireloop.com/#website",
          "url": "https://forgehireloop.com/",
          "name": "ForgeHireloop",
          "description": "Next-generation hiring and job discovery platform connecting exceptional engineering, product, and leadership talent with top tech companies.",
          "publisher": {
            "@id": "https://forgehireloop.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://forgehireloop.com/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://forgehireloop.com/#organization",
          "name": "ForgeHireloop Technologies Inc.",
          "url": "https://forgehireloop.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://forgehireloop.com/favicon.svg"
          },
          "sameAs": [
            "https://twitter.com/forgehireloop",
            "https://linkedin.com/company/forgehireloop"
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
